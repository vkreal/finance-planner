# Deploy the packaged (static, localStorage) Finance Planner to
# GitHub Pages.
#
# This workflow builds ONLY the packaged target under packaged/ — a
# fully static site that runs entirely in a visitor's browser with all
# data in localStorage and no backend. The live artifact (the owner's
# server-backed app) is built and shipped separately through the
# web-artifact builder and is not touched by this workflow.
#
# One-time setup (repo owner): Settings -> Pages -> Source:
# "GitHub Actions".
name: Deploy packaged Finance Planner to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10

      # The root package.json pins @hatch/space-sdk to a local file:
      # path that exists only on the artifact build machine. Point it
      # at the identical vendored copy under packaged/vendor/ so the
      # root install (needed for the client stylesheet's tailwind
      # imports) can resolve. This edits only the runner's checkout;
      # the committed tree is unchanged.
      - name: Point the root SDK dependency at the vendored copy
        run: |
          sed -i 's#"@hatch/space-sdk": "file:/opt/hatch/.*"#"@hatch/space-sdk": "file:./packaged/vendor/space-sdk"#' package.json
          grep '"@hatch/space-sdk"' package.json

      - name: Install root dependencies (stylesheet resolution)
        run: bun install

      - name: Install packaged dependencies
        working-directory: packaged
        run: bun install

      - name: Build the packaged site
        working-directory: packaged
        run: bun run build

      # Verification gate (contract v60, F8): the packaged harness
      # — which runs the full fixture census (the tax suite chunked
      # via packaged/taxtest.ts, plus the extended / roth-cas /
      # retirement / ui-state / integrity suites through the real
      # packaged dispatcher) and the store-protocol, backup, and
      # seed acceptance checks — must pass BEFORE anything deploys.
      # A failing suite fails this step, the job, and the
      # deployment. (The headless-Chromium probe, packaged/probe.ts,
      # needs the packaged dist plus a Chromium binary at a
      # machine-specific path, so it stays a local/release check;
      # the harness covers the same pinned figures headlessly.)
      - name: Run the packaged harness and fixture census (deploy gate)
        working-directory: packaged
        run: bun run harness

      - uses: actions/configure-pages@v5
        with:
          # Enable Pages with the GitHub Actions source automatically if it
          # was never turned on in repo settings (avoids the one-time manual
          # Settings -> Pages flip; harmless when already enabled).
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: packaged/dist

      - uses: actions/deploy-pages@v4
        id: deployment
